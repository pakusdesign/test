name: Offline release smoke test (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published offline release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/assets" | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP/assets" --pattern 'vacancy-brief-windows-x64.zip' --pattern 'ollama-runtime-windows-x64.zip' --pattern 'ggml-small.bin' --pattern 'qwen3-4b-instruct.part-*'
          Expand-Archive "$env:RUNNER_TEMP/assets/vacancy-brief-windows-x64.zip" "$env:RUNNER_TEMP/app" -Force
          $app = "$env:RUNNER_TEMP/app/vacancy-brief-windows-x64"
          New-Item -ItemType Directory -Force "$app/model-assets" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/assets/ollama-runtime-windows-x64.zip", "$env:RUNNER_TEMP/assets/ggml-small.bin", "$env:RUNNER_TEMP/assets/qwen3-4b-instruct.part-01", "$env:RUNNER_TEMP/assets/qwen3-4b-instruct.part-02" "$app/model-assets/"
      - name: Start completely local application
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP/app/vacancy-brief-windows-x64"
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','start.cmd' -WorkingDirectory $app -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/offline-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/offline-stderr.log"
          $process.Id | Out-File "$env:RUNNER_TEMP/offline-pid.txt"
          $ready = $false
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep -Seconds 1
            try {
              $config = Invoke-RestMethod 'http://127.0.0.1:3200/api/config' -TimeoutSec 2
              if ($config.mode -eq 'live' -and $config.live.sttConfigured -and $config.live.llmConfigured) { $ready = $true; break }
            } catch { }
            if ($process.HasExited) { break }
          }
          if (-not $ready) {
            Get-Content "$env:RUNNER_TEMP/offline-stdout.log" -Tail 80 -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP/offline-stderr.log" -Tail 80 -ErrorAction SilentlyContinue
            throw 'Автономный пакет не запустился на Windows.'
          }
          Write-Output 'Windows: локальный STT и LLM готовы.'
      - name: Transcribe audio without cloud keys
        shell: pwsh
        run: |
          $form = @('requestId=offline-windows-stt','sessionRevision=0','answerId=a1','audio=@tests/evals/audio/local-russian.webm;type=audio/webm')
          $body = & curl.exe -sS --max-time 120 -F $form[0] -F $form[1] -F $form[2] -F $form[3] 'http://127.0.0.1:3200/api/transcribe'
          $result = $body | ConvertFrom-Json
          if (-not $result.text -or $result.source -ne 'provider') { throw "Распознавание не сработало: $body" }
          Write-Output 'Windows: речь распознана локально.'
      - name: Analyze answer without cloud keys
        shell: pwsh
        run: |
          $body = @{ requestId='offline-windows-analysis'; snapshot=@{ sessionRevision=1; answers=@(@{ id='a1'; questionId='q1'; revision=1; text='Каждый день специалист проверяет причины отказов оплаты и готовит отчёты по конверсии.'; active=$true }); confirmedFactIds=@() } } | ConvertTo-Json -Depth 10
          $result = Invoke-RestMethod 'http://127.0.0.1:3200/api/analyze' -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 130
          if ($result.source -ne 'provider' -or $result.analysis.facts.Count -lt 1) { throw 'Модель не выделила факты.' }
          Write-Output "Windows: анализ выполнен локально, фактов: $($result.analysis.facts.Count)."
      - name: Show logs after failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP/offline-stdout.log" -Tail 100 -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP/offline-stderr.log" -Tail 100 -ErrorAction SilentlyContinue
